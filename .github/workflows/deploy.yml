name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a run halfway: it may be applying migrations or deploying the referee.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The web client needs the backend it talks to: migrations and the match
  # referee go out first, and the site only deploys if they succeeded.
  backend:
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  build:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-itch:
    needs: build
    runs-on: ubuntu-latest
    if: vars.ITCH_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist-archive
      - name: Extract build artifact
        run: tar -xf dist-archive/artifact.tar -C dist-archive && rm dist-archive/artifact.tar
      - name: Install butler
        uses: jdno/setup-butler@v1
      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Push to itch.io
        run: butler push dist-archive/ johannesjo/7-seconds:html5 --userversion ${{ steps.version.outputs.version }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
